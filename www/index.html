.sq{width:11vh;height:11vh;border:.55vh solid var(--o);border-radius:2vh;font-size:5vh;box-shadow:0 .7vh 0 var(--o),inset 0 .4vh 0 #ffffff66;position:relative}.sq.y{background:linear-gradient(#ffe066,#f29a00)}.sq.b{background:linear-gradient(#5ab0ff,#1d63c9)}
.toast{position:fixed;left:50%;top:3vh;transform:translateX(-50%);background:#1c2230;border:.5vh solid var(--o);border-radius:99px;padding:1vh 2.4vw;font-size:3vh;z-index:70;pointer-events:none;text-shadow:var(--ts)}
.ad{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
#rot{position:fixed;inset:0;background:#101320;z-index:99;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:24px;text-align:center;padding:20px}
@media (orientation:portrait){#rot{display:flex}}

/* animations */
.box{animation:boxIn .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes boxIn{from{transform:scale(.6) translateY(6vh);opacity:0}to{transform:none;opacity:1}}
.modal{animation:fadeIn .2s both}@keyframes fadeIn{from{opacity:0}}
.play,.bt.g.big{position:relative;overflow:hidden}
.play::after,.bt.g.big::after{content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(100deg,transparent,#ffffffaa,transparent);transform:skewX(-20deg);animation:shine 2.6s infinite}
@keyframes shine{0%,60%{left:-40%}100%{left:130%}}
.play{animation:breathe 1.6s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.04)}}
.card.big .vsb{display:inline-block;animation:vsPulse 1s ease-in-out infinite}@keyframes vsPulse{50%{transform:scale(1.18) rotate(-6deg)}}
.cnt.bump{display:inline-block;animation:bump .4s}@keyframes bump{50%{transform:scale(1.35);color:#7dff2c}}
.scr .topbar,.scr .lcol,.scr .rcol,.scr .bottom,.scr .ped{animation:slideIn .5s cubic-bezier(.2,1.3,.4,1) both}
.scr .lcol{animation-name:slideL}.scr .rcol{animation-name:slideR}.scr .bottom{animation-name:slideU;animation-delay:.1s}.scr .ped{animation-name:zoomIn;animation-delay:.05s}
@keyframes slideIn{from{transform:translateY(-8vh);opacity:0}}@keyframes slideL{from{transform:translateX(-20vw);opacity:0}}@keyframes slideR{from{transform:translateX(30vw);opacity:0}}@keyframes slideU{from{transform:translateY(20vh);opacity:0}}@keyframes zoomIn{from{transform:scale(.5);opacity:0}}
.rcard{animation:pop .6s cubic-bezier(.3,1.7,.5,1) both,float 2.4s ease-in-out .6s infinite}@keyframes float{50%{transform:translateY(-1.6vh) rotate(1.5deg)}}
.chest.shake{animation:shake .45s infinite}
/* vestiaire */
.vest{display:flex;gap:1.6vw;min-height:0;height:72vh}
.vprev{width:30%;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 40%,#5ab0ff55,#0000 70%);border-radius:2vh}
.vprev canvas{width:100%;flex:1;min-height:0}
.podium.sm{width:70%;height:5vh;margin-top:-3vh}
.sbars{width:100%;display:flex;flex-direction:column;gap:.7vh;margin-top:1.6vh}
.sbar{display:flex;align-items:center;gap:.6vw;font-size:2.2vh}.sbar span{width:9vw;font-family:Arial;font-weight:bold}.sbar b{width:7vw;text-align:right;font-size:2.6vh;text-shadow:var(--ts)}
.sb{flex:1;height:2.4vh;background:#0006;border:.35vh solid var(--o);border-radius:99px;position:relative;overflow:hidden}.sb i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe066,#f29a00)}.sb em{position:absolute;top:0;bottom:0;background:linear-gradient(#b4ff3c,#3fae1a);animation:blinkE 1s infinite}@keyframes blinkE{50%{opacity:.4}}
small.up{color:#7dff2c;font-size:2vh;margin-left:.3vw}small.dn{color:#ff6b6b;font-size:2vh;margin-left:.3vw}
.vright{flex:1;display:flex;flex-direction:column;gap:1.2vh;min-height:0}
.slots{display:flex;gap:1vw}.slot{flex:1;background:linear-gradient(#5a6680,#2b3245);border:.5vh solid var(--o);border-radius:1.6vh;font-size:2.8vh;padding:.8vh;display:flex;align-items:center;justify-content:center;gap:.6vw;text-shadow:var(--ts)}.slot span{font-size:4vh}.slot.on{background:linear-gradient(#ffe066,#f29a00)}
.eqgrid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:1.2vh .8vw;overflow:auto;min-height:0;padding:.6vh}
.eqc{position:relative;background:radial-gradient(circle at 50% 35%,#ffffff26,#0000 70%),linear-gradient(#3a4560,#1f2536);border:.5vh solid var(--o);border-radius:1.8vh;box-shadow:inset 0 0 0 .45vh var(--rc),0 .6vh 0 var(--o);height:15vh;transition:transform .15s}
.eqc canvas{width:100%;height:100%}.eqc.sel{transform:scale(1.06);box-shadow:inset 0 0 0 .45vh var(--rc),0 0 0 .5vh #ffd200,0 .6vh 0 var(--o)}.eqc.lock canvas{filter:saturate(.5) brightness(.75)}
.eqb{position:absolute;right:.4vh;top:.4vh;background:linear-gradient(#b4ff3c,#3fae1a);border:.35vh solid var(--o);border-radius:50%;width:4vh;height:4vh;font-size:2.4vh;display:flex;align-items:center;justify-content:center}
.lvb{position:absolute;left:.6vh;bottom:.3vh;color:#ffd200;font-size:2vh;text-shadow:var(--ts)}.prb{position:absolute;left:50%;bottom:.4vh;transform:translateX(-50%);font-size:2vh;text-shadow:var(--ts);white-space:nowrap}
.vdet{display:flex;align-items:center;justify-content:space-between;gap:1vw;background:#0004;border:.45vh solid var(--o);border-left:1.2vh solid var(--rc);border-radius:1.6vh;padding:1vh 1.2vw}
.vdet b{font-size:3.4vh;text-shadow:var(--ts)}.rt{margin-left:.8vw;background:var(--rc);border:.3vh solid var(--o);border-radius:99px;padding:0 .8vw;font-size:2vh;text-transform:uppercase}.lvt{margin-left:.6vw;color:#ffd200;font-size:2.4vh}
.bon{font-family:Arial;font-weight:bold;font-size:2.2vh;color:#b4ff3c;margin-top:.3vh}.tagok{font-size:3vh;color:#7dff2c;text-shadow:var(--ts)}
</style>
</head>
