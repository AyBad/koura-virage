<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Koura Virage</title>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-display:block}
@font-face{font-family:"Luckiest Guy";src:url(fonts/luckiest-guy-latin-400-normal.woff2) format("woff2");font-display:block}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0b1020;font-family:"Lilita One",sans-serif;color:#fff;touch-action:none;overscroll-behavior:none}
:root{--o:#14171f;--ts:0 .35vh 0 #14171f,-.2vh -.2vh 0 #14171f,.2vh -.2vh 0 #14171f,-.2vh .2vh 0 #14171f,.2vh .2vh 0 #14171f,0 .6vh .6vh #0008}
#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:none;overflow:hidden}
#ui.on{display:block}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
b,small,span,em{font-style:normal}
.bgimg{position:absolute;inset:-2%;background-size:cover;background-position:center}
.kb{animation:kb 18s ease-in-out infinite alternate}.kb2{animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.12) translate(-1.5%,1%)}}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,#0000 35%,#000a 100%)}
/* étincelles qui montent */
.spark,.conf{position:absolute;inset:0;pointer-events:none;background-image:
 radial-gradient(circle,#ffe9a0 0 .35vh,#0000 .5vh),radial-gradient(circle,#fff 0 .25vh,#0000 .4vh),radial-gradient(circle,#ffb347 0 .3vh,#0000 .45vh);
 background-size:23vh 31vh,17vh 23vh,29vh 37vh;animation:rise 9s linear infinite;opacity:.8}
@keyframes rise{from{background-position:0 0,5vh 0,9vh 0}to{background-position:4vh -62vh,-3vh -69vh,6vh -74vh}}
.conf{background-image:linear-gradient(#e70013,#e70013),linear-gradient(#ffd200,#ffd200),linear-gradient(#fff,#fff);background-size:1.2vh .7vh;background-repeat:no-repeat;animation:none}
/* boutons peints */
.mbtn{position:relative;display:flex;align-items:center;justify-content:center;gap:1vh;height:9.5vh;padding:0 4vh;font-family:"Luckiest Guy";font-size:3.6vh;letter-spacing:.05em;text-shadow:var(--ts);background:center/100% 100% no-repeat;transition:transform .12s;filter:drop-shadow(0 .8vh .6vh #0007)}
.mbtn span{font-size:3.4vh}.mbtn:active{transform:scale(.92)}
.mbtn.green{background-image:url(img/ui/b_green.webp)}.mbtn.yellow{background-image:url(img/ui/b_yellow.webp)}.mbtn.blue{background-image:url(img/ui/b_blue.webp)}.mbtn.gray{background-image:url(img/ui/b_gray.webp)}.mbtn.red{background-image:url(img/ui/b_red.webp)}.mbtn.orange{background-image:url(img/ui/b_orange.webp)}
.mbtn.small{height:7.5vh;font-size:2.8vh}.mbtn.wide{width:100%}
.mbtn::after{content:'';position:absolute;inset:0;border-radius:2vh;background:linear-gradient(105deg,#0000 40%,#fff6 50%,#0000 60%) -200% 0/200% 100% no-repeat;animation:shine 3.5s infinite;pointer-events:none;mix-blend-mode:overlay}
@keyframes shine{0%,60%{background-position:-200% 0}100%{background-position:200% 0}}
.back{position:absolute;left:2vh;top:1.5vh;width:8vh;height:8vh;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ff8a6a,#d8261c);border:.5vh solid var(--o);font-size:3.6vh;text-shadow:var(--ts);box-shadow:0 .6vh 0 var(--o);z-index:3}
.sbtn{width:6.5vh;height:6.5vh;border-radius:50%;background:#0008;border:.4vh solid #fff5;font-size:3vh}
/* titre */
.ttap{position:absolute;left:0;right:0;bottom:7vh;text-align:center;font-family:"Luckiest Guy";font-size:5vh;color:#ffd200;text-shadow:var(--ts);animation:pulse 1.1s ease-in-out infinite;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7vh}
@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.3)}}
.ver{position:absolute;right:2vh;bottom:1.5vh;font-size:2.2vh;opacity:.7}
.loadc{position:absolute;left:50%;bottom:10vh;transform:translateX(-50%);text-align:center;font-family:"Luckiest Guy";font-size:4vh;text-shadow:var(--ts);width:50vh}
/* barre du haut */
.top{position:absolute;top:2vh;left:12vh;right:2vh;display:flex;align-items:center;gap:1.5vh;z-index:2}
.pill{display:flex;align-items:center;gap:1vh;height:6.5vh;padding:0 2vh 0 .8vh;background:linear-gradient(#1b2850ee,#0e1734ee);border:.4vh solid var(--o);border-radius:4vh;font-size:2.8vh;text-shadow:var(--ts);box-shadow:inset 0 .4vh 0 #ffffff22}
.pill.dt{margin-left:auto}.pill.dt b{color:#ffe066}.pill small{font-size:2vh;opacity:.8}.cash{font-size:3vh;margin-left:.6vh}
.pico{width:5.4vh;height:5.4vh;object-fit:contain;background:#fff;border-radius:50%;border:.3vh solid var(--o)}
/* personnage HTML animé */
.hero{position:relative;width:20vh;height:24vh}
.hero .hboot{position:absolute;left:30%;bottom:0;width:66%;transform-origin:50% 90%}
.hero .hboot{transform:scaleX(-1)}
.hero .hhead{position:absolute;left:44%;bottom:23%;height:74%;aspect-ratio:245/260;transform:translateX(-50%);transform-origin:50% 90%}
.hhead img{position:absolute}.hhead .hface{inset:0;width:100%;height:100%}
.hero.evo2{filter:drop-shadow(0 0 2vh #b060ff)}.hero.evo3{filter:drop-shadow(0 0 2.5vh #ffc400)}
.hero .hsh{position:absolute;left:12%;right:12%;bottom:-2%;height:9%;border-radius:50%;background:radial-gradient(#0009,#0000 70%)}
.hero.big{width:30vh;height:36vh}
.hero.flip{transform:scaleX(-1)}
.hero.idle .hhead{animation:hbob 1.6s ease-in-out infinite}.hero.idle .hboot{animation:hbt 1.6s ease-in-out infinite}.hero.idle{animation:hsq 1.6s ease-in-out infinite;transform-origin:50% 100%}
@keyframes hbob{0%,100%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) translateY(-3%) rotate(3deg)}}
@keyframes hbt{0%,100%{transform:scaleX(-1) rotate(0)}50%{transform:scaleX(-1) rotate(4deg)}}
@keyframes hsq{0%,100%{transform:scale(1.03,.97)}50%{transform:scale(.98,1.03)}}
.hero.joy{animation:hjump .7s cubic-bezier(.3,0,.5,1) infinite;transform-origin:50% 100%}
@keyframes hjump{0%,100%{transform:translateY(0) scale(1.08,.92)}15%{transform:scale(.94,1.08)}50%{transform:translateY(-18%) scale(.97,1.04) rotate(-4deg)}85%{transform:translateY(0) scale(1,1)}}
.hero.locked img{filter:brightness(0) drop-shadow(0 0 .4vh #fff8)}
/* accueil */
.beams i{position:absolute;top:-10vh;left:50%;width:20vh;height:100vh;background:linear-gradient(#fff6c06a,#fff6c000 80%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);transform-origin:50% 0;mix-blend-mode:screen;animation:beam 6s ease-in-out infinite alternate}
.beams i:nth-child(1){margin-left:-24vh;animation-delay:-2s}.beams i:nth-child(2){margin-left:-10vh}.beams i:nth-child(3){margin-left:4vh;animation-delay:-4s}
@keyframes beam{from{transform:rotate(18deg)}to{transform:rotate(-18deg)}}
.homeL{position:absolute;left:4vh;top:50%;transform:translateY(-40%);display:flex;flex-direction:column;gap:2vh;width:42vh;animation:inL .5s both}
.homeR{position:absolute;right:4vh;top:50%;transform:translateY(-35%);display:flex;flex-direction:column;align-items:center;gap:2vh;animation:inR .5s both}
@keyframes inL{from{transform:translate(-60vh,-40%)}}@keyframes inR{from{transform:translate(60vh,-35%)}}
.stagec{position:absolute;left:50%;bottom:8vh;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.stagec .hero{filter:drop-shadow(0 0 3vh #ffd27a88)}
.plate{margin-top:1vh;background:#0b1430dd;border:.4vh solid var(--o);border-radius:2vh;padding:.6vh 3vh;text-align:center;text-shadow:var(--ts)}.plate b{display:block;font-size:3.2vh}.plate small{font-size:2.2vh}
.playbtn{width:46vh;height:22vh;background:url(img/ui/b_green.webp) center/100% 100% no-repeat;display:flex;flex-direction:column;align-items:center;justify-content:center;filter:drop-shadow(0 1.2vh 1vh #000a);animation:breathe 1.6s ease-in-out infinite;position:relative}
.playbtn .pl1{font-family:"Luckiest Guy";font-size:8.5vh;text-shadow:var(--ts);line-height:1}.playbtn .pl2{font-size:2.6vh;text-shadow:var(--ts);opacity:.95}
@keyframes breathe{50%{transform:scale(1.05)}}
.playbtn:active{transform:scale(.93)}
.rec{display:flex;flex-direction:column;align-items:center;gap:.6vh;font-size:2.5vh;text-shadow:var(--ts);background:#0007;border-radius:2vh;padding:1vh 2.4vh}
/* boutique personnages / chaussures */
.shop{position:absolute;inset:10vh 2vh 2vh;display:grid;grid-template-columns:44% 1fr;gap:2vh}
.shL{display:flex;flex-direction:column;align-items:center;gap:1vh;padding:1vh 2vh;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--rc) 55%,#0000),#0b1430e6 70%);border:.5vh solid var(--o);border-radius:3vh;box-shadow:inset 0 0 0 .4vh color-mix(in srgb,var(--rc) 80%,#fff 0%)}
.shName{font-family:"Luckiest Guy";font-size:4.4vh;color:#ffd200;text-shadow:var(--ts);text-align:center;line-height:1.05;animation:pop .35s both}
.shSub{font-size:2.2vh;opacity:.9;text-align:center}
.shStage{position:relative;flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.shStage .hero.big{width:26vh;height:30vh}
.halo{position:absolute;bottom:0;left:50%;width:34vh;height:34vh;transform:translateX(-50%);background:radial-gradient(circle,color-mix(in srgb,var(--rc) 70%,#fff 30%) 0,#0000 65%);opacity:.6;animation:breathe 2.4s infinite}
.stats{width:100%;display:flex;flex-direction:column;gap:.5vh}
.st{display:flex;align-items:center;gap:1vh;font-size:2.2vh}.st span{width:9vh}.st i{flex:1;height:1.6vh;background:#0008;border-radius:1vh;overflow:hidden;border:.2vh solid var(--o)}.st i b{display:block;height:100%;background:linear-gradient(90deg,#3fae1a,#b4ff3c)}.st em{width:5vh;text-align:right}
.shR{overflow-y:auto;padding:1vh;background:#0b1430c0;border:.5vh solid var(--o);border-radius:3vh}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15vh,1fr));gap:1.4vh}
.card{position:relative;height:19vh;border-radius:2vh;border:.45vh solid var(--o);background:radial-gradient(circle at 50% 35%,#ffffff40,#0000 65%),linear-gradient(color-mix(in srgb,var(--rc) 75%,#fff 0%),#1a2340);overflow:hidden;box-shadow:0 .5vh 0 var(--o);transition:transform .15s}
.card.sel{transform:translateY(-.8vh);box-shadow:0 0 0 .5vh #ffd200,0 .5vh 0 var(--o)}
.card .chead{position:absolute;left:50%;top:4%;height:74%;transform:translateX(-50%)}
.card .cboot{position:absolute;left:8%;right:8%;top:22%;width:84%}
.card.lock .chead,.card.lock .cboot{filter:brightness(.25) saturate(0)}
.card .cr{position:absolute;left:0;right:0;bottom:0;padding:.5vh 0;background:#0009;font-size:1.9vh;text-align:center;text-shadow:var(--ts)}
.card .chk{position:absolute;left:.6vh;top:.6vh;width:4vh;height:4vh;border-radius:1vh;background:linear-gradient(#b4ff3c,#3fae1a);border:.3vh solid var(--o);font-size:2.6vh;display:flex;align-items:center;justify-content:center}
.shopv .top{left:12vh}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* VS */
.vsW{position:absolute;inset:0}
.vsP{position:absolute;top:24vh;width:40vh;display:flex;flex-direction:column;align-items:center}
.vsP.L{left:calc(50% - 62vh);animation:vsL .45s cubic-bezier(.2,1.4,.4,1) both}.vsP.R{right:calc(50% - 62vh);animation:vsR .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes vsL{from{transform:translateX(-80vh)}}@keyframes vsR{from{transform:translateX(80vh)}}
.vsN{font-family:"Luckiest Guy";font-size:4vh;text-shadow:var(--ts);margin-top:1vh}.vsC{font-size:2.4vh;opacity:.9;text-shadow:var(--ts)}
.vsLoad{position:absolute;left:50%;bottom:6vh;width:40vh;height:1.6vh;transform:translateX(-50%);background:#0008;border-radius:1vh;overflow:hidden;border:.3vh solid var(--o)}
.loadc .vsLoad{position:relative;bottom:auto;margin:1.5vh auto 0}
.vsLoad i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd200,#ff8a1a);transition:width .2s}
/* résultat */
.res{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;background:radial-gradient(ellipse at 50% 50%,#0000 30%,#0009)}
.rT{font-family:"Luckiest Guy";font-size:11vh;color:#ffd200;text-shadow:0 .8vh 0 #14171f,-.4vh -.4vh 0 #14171f,.4vh -.4vh 0 #14171f,-.4vh .4vh 0 #14171f,.4vh .4vh 0 #14171f,0 0 4vh #ff9d00;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.res.l .rT{color:#dfe8ff;text-shadow:var(--ts)}
.res{background:radial-gradient(ellipse at 50% 55%,#000a 20%,#0000 60%,#0009)}
.rRow{display:flex;align-items:center;gap:6vh}
.rS{font-family:"Luckiest Guy";font-size:12vh;text-shadow:var(--ts);display:flex;gap:2vh;animation:pop .5s .2s both}.rS span{opacity:.7}
.rG{font-size:5vh;color:#ffe066;text-shadow:var(--ts);animation:pop .4s .5s both}
.rB{display:flex;gap:3vh;margin-top:1vh}
/* pause, déblocage, toast */
.pause{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:10}
.pbox{width:44vh;display:flex;flex-direction:column;gap:2vh;align-items:center;animation:pop .25s both}.pbox h2{font-family:"Luckiest Guy";font-size:8vh;text-shadow:var(--ts)}
.unlock{position:fixed;inset:0;z-index:10;background:radial-gradient(#3a1a6a,#0b0620);display:flex;align-items:center;justify-content:center;overflow:hidden}
.urays{position:absolute;width:200vh;height:200vh;background:repeating-conic-gradient(#ffd20033 0 10deg,#0000 10deg 20deg);animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ubox{position:relative;display:flex;flex-direction:column;align-items:center;animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
.ut{font-family:"Luckiest Guy";font-size:7vh;color:#ffd200;text-shadow:var(--ts)}.un{font-size:4vh;text-shadow:var(--ts)}
.toast{position:fixed;left:50%;top:14vh;transform:translateX(-50%);background:#0b1430f0;border:.4vh solid #ffd200;border-radius:3vh;padding:1.4vh 3vh;font-size:3vh;z-index:20;animation:pop .25s both;text-shadow:var(--ts)}

/* V1.1 */
.pill{cursor:pointer}.pic{width:4.6vh;height:4.6vh;object-fit:contain}.pill.jt{margin-left:auto}.pill.dt{margin-left:0}.pill.jt b{color:#ff7a8a}
.plus{display:flex;align-items:center;justify-content:center;width:3.6vh;height:3.6vh;border-radius:50%;background:linear-gradient(#b4ff3c,#3fae1a);border:.3vh solid var(--o);font-style:normal;font-size:2.6vh;margin-left:.4vh}
.pcr{width:4.8vh;height:4.8vh;object-fit:contain}
.bic{width:5vh;height:5vh;object-fit:contain;vertical-align:middle}.bic.s{width:3.2vh;height:3.2vh}
.mbtn .dot{position:absolute;right:1vh;top:-.8vh;width:3.6vh;height:3.6vh;border-radius:50%;background:#e70013;border:.3vh solid var(--o);font-style:normal;font-size:2.4vh;display:flex;align-items:center;justify-content:center;animation:pulse 1s infinite}
.homeL{width:40vh;top:44%}.homeR{top:44%}
.stagec{bottom:19vh}.stagec .hero.big{width:26vh;height:31vh}
.divb{display:flex;align-items:center;gap:1.2vh;background:#0b1430d8;border:.4vh solid var(--o);border-radius:2vh;padding:.6vh 2vh .6vh 1vh;text-shadow:var(--ts)}.divb img{height:6vh}.divb b{display:block;font-size:2.8vh}.divb small{font-size:2vh;opacity:.9}
.playbtn{height:18vh}.playbtn .pl1{font-size:7.5vh}
.venue{background:#0b1430d8;border:.4vh solid var(--o);border-radius:3vh;padding:.8vh 2.4vh;font-size:2.4vh;text-shadow:var(--ts)}
.derby{background:linear-gradient(90deg,#e70013,#ff8a1a);border:.4vh solid var(--o);border-radius:2vh;padding:.6vh 2vh;font-size:2.2vh;text-shadow:var(--ts);animation:pulse 1.4s infinite;text-align:center}
.chestbar{position:absolute;left:50%;bottom:1.5vh;transform:translateX(-50%);display:flex;gap:1.6vh}
.cslot{position:relative;width:17vh;height:15vh;border-radius:2vh;border:.45vh solid var(--o);background:linear-gradient(#2a3a6e,#121b3a);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:.6vh;box-shadow:0 .5vh 0 var(--o);text-shadow:var(--ts)}
.cslot img{position:absolute;top:.4vh;height:8.4vh}.cslot b{font-size:2.3vh;z-index:1}.cslot small{font-size:1.7vh;opacity:.85;z-index:1}
.cslot.empty{background:#0b143099;border-style:dashed;border-color:#fff4;justify-content:center;font-size:1.8vh;opacity:.8;box-shadow:none}
.cslot.ready{background:linear-gradient(#ffd200,#e07800);animation:breathe 1.2s infinite}.cslot.ready img{animation:wob .9s infinite}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
/* popups */
.pop{position:fixed;inset:0;z-index:12;background:#000a;display:flex;align-items:center;justify-content:center}
.pbx{min-width:56vh;max-width:90vw;background:linear-gradient(#1d2a55,#0b1430);border:.6vh solid var(--o);border-radius:3vh;padding:2.4vh 3vh;display:flex;flex-direction:column;align-items:center;gap:1.2vh;text-align:center;text-shadow:var(--ts);animation:pop .25s both;box-shadow:inset 0 0 0 .4vh #ffd20066}
.pbx h3{font-family:"Luckiest Guy";font-size:4.4vh;color:#ffd200}.pbx p{font-size:2.6vh}.sm{font-size:2vh!important;opacity:.85}
.popimg{height:16vh;animation:wob 1.6s infinite}.prow{display:flex;gap:2vh;flex-wrap:wrap;justify-content:center}
.days{display:flex;gap:1vh}.days i{width:5vh;height:5vh;border-radius:1.2vh;background:#0008;border:.3vh solid #fff4;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:2.4vh}.days i.ok{background:#3fae1a}.days i.now{background:#ffd200;color:#14171f;text-shadow:none;transform:scale(1.15)}
.rew{display:flex;gap:2vh;justify-content:center;flex-wrap:wrap}.rw{display:flex;flex-direction:column;align-items:center;gap:.4vh;background:#0006;border-radius:2vh;padding:1.2vh 2vh;border:.4vh solid var(--o);animation:pop .4s both}.rw img{height:9vh}.rw b{font-size:3vh}.rw.item{box-shadow:inset 0 0 0 .4vh var(--rc)}.rw small{color:var(--rc)}
.chshake{height:30vh;animation:shk .12s infinite}@keyframes shk{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(4deg) scale(1.06)}}
/* pub */
.adv{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center}
.adbox{position:relative;width:80vw;max-width:120vh;text-align:center;font-size:3vh}.adbox img{width:100%;border-radius:2vh;margin:1vh 0}.adbox small{opacity:.6;letter-spacing:.2em}
.adc{position:absolute;right:1vh;top:4vh;width:7vh;height:7vh;border-radius:50%;background:#000a;border:.4vh solid #fff;display:flex;align-items:center;justify-content:center;font-size:3.4vh}
/* panneaux */
.panel{position:absolute;inset:10vh 4vh 3vh 4vh;background:#0b1430e0;border:.5vh solid var(--o);border-radius:3vh;padding:2vh 3vh;overflow-y:auto;text-shadow:var(--ts)}
.panel h2{font-family:"Luckiest Guy";font-size:4.4vh;color:#ffd200;display:flex;align-items:center;gap:1.4vh;margin-bottom:1.4vh}.panel h2 img{height:6vh}
.mrow{display:flex;align-items:center;gap:2vh;background:#ffffff12;border:.4vh solid var(--o);border-radius:2vh;padding:1.2vh 2vh;margin-bottom:1.2vh}.mrow.dn{box-shadow:inset 0 0 0 .4vh #7dff2c}.mrow.cl{opacity:.55}
.mt{flex:1;display:flex;flex-direction:column;gap:.5vh}.mt b{font-size:2.8vh}.mt i{height:1.8vh;background:#0008;border-radius:1vh;overflow:hidden;border:.2vh solid var(--o)}.mt i em{display:block;height:100%;background:linear-gradient(90deg,#ffd200,#ff8a1a)}.mt small{font-size:1.9vh}
.mr{display:flex;gap:1.4vh;font-size:2.6vh}.mr span{display:flex;align-items:center;gap:.4vh}.mr img{height:3.6vh}
.mrow .mbtn{min-width:20vh}
.tabs,.vtabs{display:flex;gap:1vh;margin-bottom:1.4vh;flex-wrap:wrap}
.tabs button,.vtabs button{padding:1vh 2.4vh;border-radius:2vh 2vh .6vh .6vh;background:#22305c;border:.4vh solid var(--o);font-size:2.6vh;text-shadow:var(--ts)}.tabs button.on,.vtabs button.on{background:linear-gradient(#ffd200,#ff8a1a)}
