 else if(t==='goal'){const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=NB;s.loop=true;f.type='bandpass';f.frequency.value=900;f.Q.value=.6;g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(.45,n+.3);g.gain.linearRampToValueAtTime(0,n+2.6);s.connect(f).connect(g).connect(a.destination);s.start(n);s.stop(n+2.7);}
 else if(t==='power'){const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,n);o.frequency.exponentialRampToValueAtTime(900,n+.3);g.gain.setValueAtTime(.12,n);g.gain.exponentialRampToValueAtTime(.001,n+.4);o.connect(g).connect(a.destination);o.start(n);o.stop(n+.4);}
 else if(t==='post'){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=520;g.gain.setValueAtTime(.3,n);g.gain.exponentialRampToValueAtTime(.001,n+.5);o.connect(g).connect(a.destination);o.start(n);o.stop(n+.5);}

 else if(t==='tap'){const o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.08);o.connect(g).connect(a.destination);o.start(n);o.stop(n+.09);}
 else if(t==='coin'){[880,1320].forEach((fq,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=fq;g.gain.setValueAtTime(.05,n+i*.08);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.12);o.connect(g).connect(a.destination);o.start(n+i*.08);o.stop(n+i*.08+.13);});}}

function settings(){modal(`<h2>Paramètres</h2><div class="row"><button class="bt ${S.snd?'g':'s'}" data-a="snd">SON : ${S.snd?'OUI':'NON'}</button><button class="bt ${S.vib?'g':'s'}" data-a="vib">VIBRATIONS : ${S.vib?'OUI':'NON'}</button></div>
 <div class="row"><input id="nk2" maxlength="14" value="${esc(S.nick)}" style="width:40%"><button class="bt s" data-a="nick">CHANGER LE PSEUDO</button></div>
 <div class="row"><button class="bt s" data-a="club">CHANGER DE CLUB</button><button class="bt s" data-a="help">COMMANDES</button><button class="bt s" data-a="about">À PROPOS</button>${Ads.ok?'<button class="bt s" data-a="consent">CONFIDENTIALITÉ PUB</button>':''}</div>
 <div class="txt" style="font-size:2.2vh;opacity:.7">Bilan : ${S.stats.w} V • ${S.stats.d} N • ${S.stats.l} D • ${S.stats.gf} buts marqués • ${S.ch.titles} titre(s) en Division 1</div>`,a=>{
 if(a==='snd'){S.snd=S.snd?0:1;save();settings();}else if(a==='vib'){S.vib=S.vib?0:1;save();settings();}
 else if(a==='nick'){const v=document.getElementById('nk2').value.trim().slice(0,14);if(v){S.nick=v;save();toast('Pseudo : '+v);home();}}
 else if(a==='club'){pickClub(false);}else if(a==='help')help();else if(a==='about')about();
 else if(a==='consent'){try{const p=Ads.A.showPrivacyOptionsForm();if(p&&p.catch)p.catch(()=>{});}catch(_){}}});}
function help(){modal(`<h2>Commandes</h2><div class="txt">Écran tactile : ◀ ▶ pour courir, ▲ pour sauter, ⚽ pour frapper, ★ pour le pouvoir spécial (quand la jauge est pleine).<br>Clavier : flèches / A-D, Espace ou ▲ pour sauter, X pour frapper, C pour le pouvoir.<br>Duel à 2 : joueur 1 = A, D, W, S, E — joueur 2 = flèches + Entrée.<br><br>La jauge de pouvoir se remplit avec le temps et à chaque touche de balle.</div>`);}
function about(){modal(`<h2>Koura Virage</h2><div class="txt">Version ${APP_VERSION} • © 2026 Syphax Apps<br>Jeu de foot 1 contre 1 à grosses têtes, ambiance des stades et des quartiers tunisiens.<br><span style="font-size:2.2vh;opacity:.75">Les noms de clubs et de stades sont utilisés à titre de référence ; les écussons du jeu sont des créations neutres aux couleurs des clubs, sans lien officiel avec eux ni avec la FTF. Les personnages sont fictifs.<br>Publicité (Android) : Google AdMob, consentement demandé au premier lancement. Les vidéos sont toujours facultatives et servent à gagner un jeton ou doubler un gain.</span></div>`);}
function tokScreen(cont){tokSync();const left=ADMAX-(S.adDay===today()?S.adN:0);
 modal(`<h2>${S.tok>0?'Tes jetons':'Plus de jetons !'}</h2><div class="txt" style="font-size:5vh">${'⚽'.repeat(S.tok)||'—'}</div><div class="txt">Chaque match classé coûte 1 jeton. Un jeton se recharge toutes les 15 minutes (maximum ${MAXT}).${S.tok<MAXT?`<br>Prochain jeton dans <b id="tk2">${mmss(nextTok())}</b>`:''}</div>
 <div class="row"><button class="bt y" data-a="ad" ${left>0?'':'disabled'}>▶ REGARDER UNE PUB : +1 JETON</button><button class="bt s" data-a="close">PLUS TARD</button></div><div class="txt" style="font-size:2.1vh;opacity:.6">${left} pub(s) encore possible(s) aujourd'hui. L'entraînement et le duel à 2 sont gratuits.</div>`,a=>{
 if(a==='ad')watchAd(()=>{S.tok++;save();sfx('coin');toast('+1 jeton ⚽');closeModal();if(cont)cont();else home();});});
 const iv=setInterval(()=>{const e=document.getElementById('tk2');if(!e){clearInterval(iv);return;}tokSync();e.textContent=mmss(nextTok());},1000);}
function needTok(go){tokSync();if(S.tok>0){go();return;}tokScreen(go);}
// ----- Championnat en ligne -----
function oppFor(div){const d=clamp(.22+(10-div)*.075+(Math.random()-.5)*.08,.15,.95);const cl=CLUBS[Math.random()*CLUBS.length|0];return {name:pick(NICKS)+(Math.random()<.4?(Math.random()*99|0):''),club:cl.id,char:pick(CHARS).id,ai:d};}
function champScreen(){const C=S.ch,D=DIVS[C.div];let lad='';for(let i=10;i>=1;i--)lad+=`<div class="ld ${i===C.div?'on':i>C.div?'done':''}">${i}</div>`;
 const max=Math.max(30,D.pr);const pct=v=>Math.min(100,v/max*100);
 let dots='';for(let i=0;i<10;i++){const r=C.res[i];dots+=`<div class="dot ${r?r.r:''}">${r?r.s:i+1}</div>`;}
 const goal=C.div===1?`Division 1 : il faut <b>24 pts</b> sur 10 matchs pour garder sa place (et décrocher le titre), sinon retour en Division 2.`:`Montée dès <b>${D.pr} pts</b>${D.rl!=null?` • Relégation sous <b>${D.rl} pts</b> après 10 matchs`:' • Pas de relégation en Division 10'}.`;
 modal(`<h2>Championnat en ligne</h2><div class="ladder">${lad}</div><div class="bar"><i style="width:${pct(C.pts)}%"></i><div class="mk" style="left:${pct(D.pr)}%"></div>${D.rl!=null&&C.div!==1?`<div class="mk r" style="left:${pct(D.rl)}%"></div>`:''}</div><div class="dots">${dots}</div>
 <div class="txt">${goal}<br>Saison : ${C.played}/10 matchs • ${C.pts} pts • Victoire 3 pts, nul 1 pt.<br><span style="font-size:2.2vh;opacity:.75">Adversaires de ton niveau • Meilleure division : ${C.best} • Titres : ${C.titles}</span></div>
 <div class="row"><button class="bt" data-a="play">JOUER LE MATCH ${C.played+1} (1 ⚽)</button></div>`,a=>{if(a==='play')needTok(()=>{const o=oppFor(C.div);const home_=Math.random()<.5;const venue={t:'stade',n:CL(home_?S.club:o.club).st};
  preMatch({mode:'champ',cost:1,c1:S.char,k1:S.club,n1:S.nick,c2:o.char,k2:o.club,n2:o.name,ai2:o.ai,venue,label:`Division ${C.div} • Match ${C.played+1}/10`});});});}
// ----- Derby -----
function derbyScreen(){const d=derbyNow(),a=CL(d[0]),b=CL(d[1]),mine=inDerby(S.club);const riv=mine?CL(d[0]===S.club?d[1]:d[0]):null;
 modal(`<h2>🔥 ${d[2]} 🔥</h2><div class="vs"><div class="sd">${shieldSVG(a)}<div class="n1">${a.n}</div></div><div class="v">VS</div><div class="sd">${shieldSVG(b)}<div class="n1">${b.n}</div></div></div>
 <div class="txt">Semaine de derby : tous les points gagnés par les fans de ces deux clubs comptent <b>double</b> au classement de la saison.<br>Fin dans ${dur(derbyEnds())}.</div>
 <div class="row">${mine?`<button class="bt" data-a="play">JOUER LE DERBY CONTRE ${riv.s} (1 ⚽)</button>`:`<div class="txt" style="opacity:.75">${CL(S.club).s} n'est pas concerné cette semaine. Les derbies tournent chaque lundi !</div>`}</div>`,x=>{if(x==='play')needTok(()=>preMatch({mode:'derby',cost:1,c1:S.char,k1:S.club,n1:S.nick,c2:pick(CHARS).id,k2:riv.id,n2:'Ultras '+riv.s,ai2:clamp(.35+(10-S.ch.div)*.05,.35,.9),venue:{t:'stade',n:a.st},label:d[2]}));});}
// ----- Classement des clubs -----
function tableScreen(){const T=clubTable(),d=derbyNow();const now=new Date(),end=new Date(now.getFullYear(),now.getMonth()+1,1);
 const rows=T.map((r,i)=>`<tr class="${r.c.id===S.club?'me':''} ${inDerby(r.c.id)?'dy':''}"><td>${i+1}</td><td style="width:4vh"><span style="display:inline-block;width:3vh;height:3.4vh;vertical-align:middle">${shieldSVG(r.c)}</span></td><td>${r.c.n}${inDerby(r.c.id)?' 🔥×2':''}</td><td style="text-align:right">${r.p.toLocaleString('fr-FR')}</td></tr>`).join('');
 modal(`<h2>Classement des clubs – ${MOIS[now.getMonth()]}</h2><div class="scrollb" style="max-height:58vh"><table>${rows}</table></div><div class="txt" style="font-size:2.2vh">Victoire = 3 pts pour ton club, nul = 1 pt (×2 pendant le derby de la semaine). Ta contribution : <b>${S.contrib} pts</b> • Fin de saison dans ${dur(end-now)}.</div>`);}
// ----- Match rapide -----
let QS={opp:null,diff:1,ven:'auto'};
function quickScreen(){const diffs=['Facile','Moyen','Difficile','Légende'];const vens=[['auto','Stade de l\'adversaire'],['mine','Mon stade'],...VAGUES.map((v,i)=>['v'+i,v.n.replace('Terrain vague – ','Terrain : ')])];
 const render=()=>modal(`<h2>Match rapide (1 ⚽)</h2><div class="txt" style="font-size:2.4vh">Adversaire</div><div class="clubs" style="grid-template-columns:repeat(8,1fr)">${CLUBS.map(c=>`<button class="cb ${QS.opp===c.id?'on':''}" data-a="o:${c.id}" style="padding:.3vh">${shieldSVG(c)}${c.s}</button>`).join('')}</div>
 <div class="sel">${diffs.map((d,i)=>`<button class="opt ${QS.diff===i?'on':''}" data-a="d:${i}">${d}</button>`).join('')}</div><div class="sel">${vens.map(v=>`<button class="opt ${QS.ven===v[0]?'on':''}" data-a="v:${v[0]}" style="font-size:2.1vh">${v[1]}</button>`).join('')}</div>
 <div class="row"><button class="bt" data-a="go">JOUER${QS.opp?'':' (adversaire au hasard)'}</button></div>`,a=>{
  if(a.startsWith('o:')){QS.opp=a.slice(2);render();}else if(a.startsWith('d:')){QS.diff=+a.slice(2);render();}else if(a.startsWith('v:')){QS.ven=a.slice(2);render();}
  else if(a==='go')needTok(()=>{const opp=QS.opp||pick(CLUBS.filter(c=>c.id!==S.club)).id;let venue;if(QS.ven==='auto')venue={t:'stade',n:CL(opp).st};else if(QS.ven==='mine')venue={t:'stade',n:CL(S.club).st};else venue=VAGUES[+QS.ven.slice(1)];
   preMatch({mode:'quick',cost:1,c1:S.char,k1:S.club,n1:S.nick,c2:pick(CHARS).id,k2:opp,n2:pick(NICKS),ai2:[.3,.55,.78,.95][QS.diff],venue,label:'Match rapide • '+diffs[QS.diff]});});});render();}
function trainSetup(){const v=pick(VAGUES);return {mode:'train',cost:0,c1:S.char,k1:S.club,n1:S.nick,c2:pick(CHARS).id,k2:pick(CLUBS).id,n2:'Weld el 7ouma',ai2:.35,venue:v,label:'Entraînement'};}
function duoScreen(){let c2=pick(CLUBS.filter(c=>c.id!==S.club)).id,h2=pick(CHARS).id;
 const render=()=>modal(`<h2>Duel à 2</h2><div class="txt" style="font-size:2.3vh">Club du joueur 2</div><div class="clubs">${CLUBS.map(c=>`<button class="cb ${c2===c.id?'on':''}" data-a="o:${c.id}" style="padding:.3vh">${shieldSVG(c)}${c.s}</button>`).join('')}</div><div class="sel">${CHARS.map(c=>`<button class="opt ${h2===c.id?'on':''}" data-a="h:${c.id}" style="font-size:2.1vh">${c.n}</button>`).join('')}</div><div class="row"><button class="bt" data-a="go">JOUER (GRATUIT)</button></div>`,a=>{
  if(a.startsWith('o:')){c2=a.slice(2);render();}else if(a.startsWith('h:')){h2=a.slice(2);render();}else if(a==='go'){closeModal();startMatch({mode:'duo',duo:1,cost:0,c1:S.char,k1:S.club,n1:'Joueur 1',c2:h2,k2:c2,n2:'Joueur 2',venue:pick([...VAGUES,{t:'stade',n:CL(S.club).st}]),label:'Duel à 2'});}});render();}
// ----- Avant / après match -----
function preMatch(o){const a=CL(o.k1),b=CL(o.k2);modal(`<h2>${o.label}</h2><div class="vs"><div class="sd">${shieldSVG(a)}<div class="n1">${esc(o.n1)}</div><div class="n2">${a.n} • ${CH(o.c1).n}</div></div><div class="v">VS</div><div class="sd">${shieldSVG(b)}<div class="n1">${esc(o.n2)}</div><div class="n2">${b.n} • ${CH(o.c2).n}</div></div></div><div class="txt">📍 ${o.venue.n}${o.mode==='champ'||o.mode==='derby'||o.mode==='quick'?(inDerby(S.club)?'<br>🔥 Semaine de derby : points du club ×2':''):''}</div><div class="row"><button class="bt g" data-a="go">YALLA ! (1 ⚽)</button></div>`,a2=>{if(a2==='go'){if(o.cost&&!spendTok()){tokScreen();return;}closeModal();startMatch(o);}});}
function startMatch(o){hideUI();closeModal();au();newMatch({...o,ai1:0});}
function results(o,sc,res){const st=S.stats;let lines=[],coins=0,ex='';
 if(o.mode!=='duo'&&o.mode!=='train'){st[res==='W'?'w':res==='D'?'d':'l']++;st.gf+=sc[0];st.ga+=sc[1];}
 if(o.cost){coins=res==='W'?30:res==='D'?12:5;if(o.mode==='champ')coins+=S.ch.div<=5?10:0;
  const base=res==='W'?3:res==='D'?1:0;const mult=inDerby(S.club)?2:1;S.contrib+=base*mult;if(base)lines.push(`+${base*mult} pts pour ${CL(S.club).s}${mult>1?' (derby ×2 🔥)':''}`);}
 if(o.mode==='champ'){const C=S.ch;C.played++;const p=res==='W'?3:res==='D'?1:0;C.pts+=p;C.res.push({r:res,s:sc[0]+'-'+sc[1]});const D=DIVS[C.div];
  if(C.div>1&&C.pts>=D.pr){ex=`⬆ MONTÉE EN DIVISION ${C.div-1} ! +200 🪙`;coins+=200;C.div--;C.best=Math.min(C.best,C.div);C.played=0;C.pts=0;C.res=[];C.seasons++;}
  else if(C.played>=10){if(C.div===1){if(C.pts>=24){ex='🏆 CHAMPION DE DIVISION 1 ! +1000 🪙';coins+=1000;C.titles++;}else{ex='⬇ Relégation en Division 2… Reviens plus fort !';C.div=2;}}
   else if(D.rl!=null&&C.pts<D.rl){ex=`⬇ Relégation en Division ${C.div+1}…`;C.div++;}else ex=`Maintien en Division ${C.div}. Nouvelle saison !`;C.played=0;C.pts=0;C.res=[];C.seasons++;}
  else lines.push(`Division ${C.div} : ${C.pts} pts après ${C.played} match(s) (montée : ${D.pr})`);}
 S.coins+=coins;save();const lc=o.duo?(sc[0]>sc[1]?'Victoire du joueur 1 !':sc[0]<sc[1]?'Victoire du joueur 2 !':'Match nul !'):pick(res==='W'?LINES.win:res==='L'?LINES.lose:LINES.draw);
 const a=CL(o.k1),b=CL(o.k2);
 modal(`<h2 style="color:${res==='W'?'#7ad65a':res==='L'?'#ff6b6b':'#ddd'}">${lc}</h2><div class="vs"><div class="sd" style="width:30%">${shieldSVG(a)}<div class="n2">${esc(o.n1)}</div></div><div class="v" style="color:#fff">${sc[0]} - ${sc[1]}</div><div class="sd" style="width:30%">${shieldSVG(b)}<div class="n2">${esc(o.n2)}</div></div></div>
 <div class="txt">${ex?`<b style="color:#ffd200">${ex}</b><br>`:''}${lines.join('<br>')}${coins?`<br>+${coins} 🪙`:''}</div>
 <div class="row">${coins&&adAllowed()?`<button class="bt y" data-a="dbl">▶ PUB : DOUBLER (+${coins} 🪙)</button>`:''}${o.mode==='champ'?'<button class="bt" data-a="next">MATCH SUIVANT (1 ⚽)</button>':o.cost||o.mode==='train'||o.mode==='duo'?`<button class="bt" data-a="again">REJOUER${o.cost?' (1 ⚽)':''}</button>`:''}<button class="bt s" data-a="menu">MENU</button></div>`,x=>{
  if(x==='dbl')watchAd(()=>{S.coins+=coins;save();sfx('coin');toast('+'+coins+' 🪙');const bt=document.querySelector('[data-a=dbl]');if(bt)bt.remove();});
  else if(x==='next'){closeModal();champScreen();}else if(x==='again'){if(o.mode==='train'){startMatch(trainSetup());return;}if(o.duo){startMatch(o);return;}needTok(()=>{if(!spendTok()){tokScreen();return;}startMatch(o);});}
  else if(x==='menu'){closeModal();home();}},true);
 if(coins)sfx('coin');}
// ================= DÉMARRAGE =================
function setOrient(o){try{const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.ScreenOrientation;if(P){const r=P.lock({orientation:o});if(r&&r.catch)r.catch(()=>{});return;}}catch(e){}try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock(o).catch(()=>{});}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(M&&M.state==='play')pauseMatch();crowd(false);}else{tokSync();if(M&&!M.paused)crowd(true);}});
try{if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App)window.Capacitor.Plugins.App.addListener('backButton',()=>{if(M)pauseMatch();else if(document.getElementById('mdl')&&!modalLock)closeModal();else home();});}catch(e){}
setOrient('landscape');Ads.init();home();
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.Capacitor)navigator.serviceWorker.register('sw.js');}catch(e){}
</script>
</body>
</html>
