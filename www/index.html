function rollChest(type){const q={bois:1,argent:1.6,or:2.6}[type];const out=[];const n=type==='or'?2:1;
 for(let i=0;i<n;i++){const r=Math.random();
  if(r<.36)out.push({k:'dt',n:Math.round((50+Math.random()*90)*q/5)*5});
  else if(r<.72){const ids=Object.keys(SP).filter(id=>spLvl(id)<3);if(!ids.length){out.push({k:'dt',n:150});continue;}out.push({k:'sp',id:pick(ids)});}
  else if(r<.86)out.push({k:'tok',n:type==='or'?3:2});
  else if(r<.96||type==='bois')out.push({k:'dt',n:Math.round(150*q/5)*5});
  else{const locked=CHARS.filter(c=>!S.own.includes(c.id)).sort((a,b)=>a.pr-b.pr).slice(0,type==='or'?6:3);if(locked.length)out.push({k:'char',id:pick(locked).id});else out.push({k:'dt',n:500});}}
 return out;}

 modal(`<h2>Classement des clubs – ${MOIS[now.getMonth()]}</h2><div class="scrollb" style="max-height:58vh"><table>${rows}</table></div><div class="txt" style="font-size:2.2vh">Victoire = 3 pts pour ton club, nul = 1 pt (×2 pendant le derby de la semaine). Ta contribution : <b>${S.contrib} pts</b> • Fin de saison dans ${dur(end-now)}.</div>`);}
let QS={opp:null,diff:1,ven:'auto'};
function quickScreen(){const diffs=['Facile','Moyen','Difficile','Légende'];const vens=[['auto','Stade de l\'adversaire'],['mine','Mon stade'],...VAGUES.map((v,i)=>['v'+i,v.n.replace('Terrain vague – ','Terrain : ')])];
 const render=()=>modal(`<h2>Match rapide (1 ⚽)</h2><div class="clubs">${CLUBS.map(c=>`<button class="cb ${QS.opp===c.id?'on':''}" data-a="o:${c.id}" style="padding:.3vh">${shieldSVG(c)}${c.s}</button>`).join('')}</div>
 <div class="sel">${diffs.map((d,i)=>`<button class="opt ${QS.diff===i?'on':''}" data-a="d:${i}">${d}</button>`).join('')}</div><div class="sel">${vens.map(v=>`<button class="opt ${QS.ven===v[0]?'on':''}" data-a="v:${v[0]}" style="font-size:2.1vh">${v[1]}</button>`).join('')}</div>
 <div class="row"><button class="bt" data-a="go">JOUER${QS.opp?'':' (adversaire au hasard)'}</button></div>`,a=>{
  if(a.startsWith('o:')){QS.opp=a.slice(2);render();}else if(a.startsWith('d:')){QS.diff=+a.slice(2);render();}else if(a.startsWith('v:')){QS.ven=a.slice(2);render();}
  else if(a==='go')needTok(()=>{const opp=QS.opp||pick(CLUBS.filter(c=>c.id!==S.club)).id;const venue=QS.ven==='auto'?{t:'stade',n:CL(opp).st}:QS.ven==='mine'?{t:'stade',n:CL(S.club).st}:VAGUES[+QS.ven.slice(1)];const ai=[.3,.55,.78,.95][QS.diff];
   preMatch(me({mode:'quick',cost:1,c2:pick(CHARS).id,k2:opp,n2:pick(NICKS),ai2:ai,g2:aiGear(ai),aiSp:aiSps(ai),venue,label:'Match rapide • '+diffs[QS.diff]}));});});render();}
function trainSetup(){return me({mode:'train',cost:0,c2:pick(CHARS.slice(0,5)).id,k2:pick(CLUBS).id,n2:'Weld el 7ouma',ai2:.35,venue:pick(VAGUES),label:'Entraînement'});}
function duoScreen(){let c2=pick(CLUBS.filter(c=>c.id!==S.club)).id,h2=pick(CHARS).id;
 const render=()=>modal(`<h2>Duel à 2</h2><div class="clubs">${CLUBS.map(c=>`<button class="cb ${c2===c.id?'on':''}" data-a="o:${c.id}" style="padding:.3vh">${shieldSVG(c)}${c.s}</button>`).join('')}</div><div class="sel">${CHARS.map(c=>`<button class="opt ${h2===c.id?'on':''}" data-a="h:${c.id}" style="font-size:2vh">${c.n}</button>`).join('')}</div><div class="row"><button class="bt" data-a="go">JOUER (GRATUIT)</button></div>`,a=>{
  if(a.startsWith('o:')){c2=a.slice(2);render();}else if(a.startsWith('h:')){h2=a.slice(2);render();}else if(a==='go'){closeModal();startMatch({mode:'duo',duo:1,cost:0,c1:S.char,k1:S.club,n1:'Joueur 1',g1:S.gear,c2:h2,k2:c2,n2:'Joueur 2',venue:pick([...VAGUES,{t:'stade',n:CL(S.club).st}]),label:'Duel à 2'});}});render();}
function preMatch(o){const a=CL(o.k1),b=CL(o.k2);const sps=S.eq.filter(id=>spLvl(id)>0).map(id=>SP[id].e+'×'+spLvl(id)).join('  ')||'aucun (voir la Boutique)';
 modal(`<h2>${o.label}</h2><div class="vs"><div class="sd">${shieldSVG(a)}<div class="n1">${esc(o.n1)}</div><div class="n2">${a.n} • ${CH(o.c1).n}</div></div><div class="v">VS</div><div class="sd">${shieldSVG(b)}<div class="n1">${esc(o.n2)}</div><div class="n2">${b.n} • ${CH(o.c2).n}</div></div></div><div class="txt">📍 ${o.venue.n}${inDerby(S.club)?'<br>🔥 Semaine de derby : points du club ×2':''}<br><span style="font-size:2.3vh">Tes super pouvoirs : ${sps}</span></div><div class="row"><button class="bt s" data-a="shop">⚡ POUVOIRS</button><button class="bt g" data-a="go">YALLA ! (1 ⚽)</button></div>`,x=>{if(x==='shop'){shop('sp');return;}if(x==='go'){if(o.cost&&!spendTok()){tokScreen();return;}closeModal();startMatch(o);}});}
function startMatch(o){ui.classList.add('hide');closeModal();au();newMatch(o);}
function results(o,sc,res,ev){const st=S.stats;let lines=[],dt=0,ex='';
 if(o.mode!=='duo'&&o.mode!=='train'){st[res==='W'?'w':res==='D'?'d':'l']++;st.gf+=sc[0];st.ga+=sc[1];}
 if(o.cost){dt=(res==='W'?40:res==='D'?15:5)+sc[0]*5;if(o.mode==='champ')dt+=(10-S.ch.div)*2;
  const base=res==='W'?3:res==='D'?1:0,mult=inDerby(S.club)?2:1;S.contrib+=base*mult;if(base)lines.push(`+${base*mult} pts pour ${CL(S.club).s}${mult>1?' (derby ×2 🔥)':''}`);
  missionEvents({win:res==='W'?1:0,goal:ev.goal,head:ev.head,high:ev.high,sp:ev.sp,play:1,clean:res==='W'&&sc[1]===0?1:0}).forEach(t=>lines.push('✅ Mission : '+t+' → 🎁 coffre en argent'));}
 if(o.mode==='champ'){const C=S.ch;C.played++;C.pts+=res==='W'?3:res==='D'?1:0;C.res.push({r:res,s:sc[0]+'-'+sc[1]});const D=DIVS[C.div];
  if(C.div>1&&C.pts>=D.pr){ex=`⬆ MONTÉE EN DIVISION ${C.div-1} ! Coffre en or + 200 DT`;dt+=200;S.chests.push('or');C.div--;C.best=Math.min(C.best,C.div);C.played=0;C.pts=0;C.res=[];C.seasons++;}
  else if(C.played>=10){if(C.div===1){if(C.pts>=24){ex='🏆 CHAMPION DE DIVISION 1 ! 2 coffres en or + 1000 DT';dt+=1000;S.chests.push('or','or');C.titles++;}else{ex='⬇ Relégation en Division 2… Reviens plus fort !';C.div=2;}}
   else if(D.rl!=null&&C.pts<D.rl){ex=`⬇ Relégation en Division ${C.div+1}…`;C.div++;}else ex=`Maintien en Division ${C.div}. Nouvelle saison !`;C.played=0;C.pts=0;C.res=[];C.seasons++;}
  else lines.push(`Division ${C.div} : ${C.pts} pts après ${C.played} match(s) (montée : ${D.pr})`);}
 S.dt+=dt;save();const lc=o.duo?(sc[0]>sc[1]?'Victoire du joueur 1 !':sc[0]<sc[1]?'Victoire du joueur 2 !':'Match nul !'):pick(res==='W'?LINES.win:res==='L'?LINES.lose:LINES.draw);
 const a=CL(o.k1),b=CL(o.k2);
 modal(`<h2 style="color:${res==='W'?'#7ad65a':res==='L'?'#ff6b6b':'#ddd'}">${lc}</h2><div class="vs"><div class="sd" style="width:30%">${shieldSVG(a)}<div class="n2">${esc(o.n1)}</div></div><div class="v" style="color:#fff">${sc[0]} - ${sc[1]}</div><div class="sd" style="width:30%">${shieldSVG(b)}<div class="n2">${esc(o.n2)}</div></div></div>
 <div class="txt">${ex?`<b style="color:#ffd200">${ex}</b><br>`:''}${lines.join('<br>')}${dt?`<br>+${dt} DT 💵`:''}</div>
 <div class="row">${dt&&adAllowed()?`<button class="bt y" data-a="dbl">▶ PUB : DOUBLER (+${dt} DT)</button>`:''}${S.chests.length?`<button class="bt y" data-a="chest">🎁 COFFRES (${S.chests.length})</button>`:''}${o.mode==='champ'?'<button class="bt" data-a="next">MATCH SUIVANT</button>':`<button class="bt" data-a="again">REJOUER${o.cost?' (1 ⚽)':''}</button>`}<button class="bt s" data-a="menu">MENU</button></div>`,x=>{
  if(x==='dbl')watchAd(()=>{S.dt+=dt;save();sfx('coin');toast('+'+dt+' DT');const bt=document.querySelector('[data-a=dbl]');if(bt)bt.remove();});
  else if(x==='chest')openChest();else if(x==='next')champScreen();else if(x==='again'){if(o.mode==='train'){startMatch(trainSetup());return;}if(o.duo){startMatch(o);return;}needTok(()=>{if(!spendTok()){tokScreen();return;}startMatch(o);});}
  else if(x==='menu'){closeModal();home();}},true);
 if(dt)sfx('coin');}
// ================= DÉMARRAGE =================
function setOrient(o){try{const P=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.ScreenOrientation;if(P){const r=P.lock({orientation:o});if(r&&r.catch)r.catch(()=>{});return;}}catch(e){}try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock(o).catch(()=>{});}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(M&&M.state==='play')pauseMatch();crowd(false);}else{tokSync();if(M&&!M.paused)crowd(true);}});
try{if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App)window.Capacitor.Plugins.App.addListener('backButton',()=>{if(intro)introTap();else if(M)pauseMatch();else if(document.getElementById('mdl')&&!modalLock)closeModal();else home();});}catch(e){}
resize();setOrient('landscape');Ads.init();startIntro();requestAnimationFrame(loop);
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!window.Capacitor)navigator.serviceWorker.register('sw.js');}catch(e){}
</script>
