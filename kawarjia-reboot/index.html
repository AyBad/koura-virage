<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10182e"><title>Kawarjia Reboot</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1327;font-family:system-ui,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block;object-fit:contain}#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#091327bd;color:#fff;z-index:2}#panel{max-width:420px;margin:20px;padding:28px;text-align:center;border:2px solid #f5c45a;border-radius:26px;background:linear-gradient(145deg,#27395c,#111b34);box-shadow:0 15px 80px #0009}h1{font-size:48px;margin:0;color:#ffcf53;text-shadow:0 5px #813c26}p{line-height:1.5}button{background:linear-gradient(#ffdd5b,#ff922c);border:3px solid #fff;border-radius:18px;padding:14px 30px;font-weight:1000;font-size:22px;color:#172137;box-shadow:0 7px #a85017;cursor:pointer}small{display:block;margin-top:18px;color:#b7c8e9}</style></head><body><canvas id="game"></canvas><div id="overlay"><div id="panel"><h1>KAWARJIA</h1><p>Un nouveau départ : football arcade, personnages géants, frappes explosives et stade vivant.</p><button id="play">JOUER ⚽</button><small>Clavier : ← → déplacer · ↑ sauter · Espace tirer · X lob<br>Tactile : boutons à l'écran</small></div></div><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),overlay=document.querySelector('#overlay');
const W=1280,H=720,GROUND=588,GRAV=.52,R=23,keys=new Set(),touch=new Set();
let scale=1,offX=0,offY=0,last=0,acc=0,tick=0,score=[0,0],time=90,phase='menu',flash=0,shake=0,particles=[],crowd=[],goalTimer=0,ball;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);scale=Math.min(canvas.width/W,canvas.height/H);offX=(canvas.width-W*scale)/2;offY=(canvas.height-H*scale)/2}addEventListener('resize',resize);resize();
const assets={};for(const [id,path] of Object.entries({stadium:'../www/img/bg/stade.webp',p1:'../www/img/h/bey_0.webp',p2:'../www/img/h/hannibal_0.webp',p1hit:'../www/img/h/bey_1.webp',p2hit:'../www/img/h/hannibal_1.webp',boot:'../www/img/eq/b_base.webp'})){const im=new Image;im.src=path;assets[id]=im}const ready=im=>im&&im.complete&&im.naturalWidth;
function reset(){score=[0,0];time=90;tick=0;crowd=Array.from({length:340},(_,i)=>({x:(i*67)%1320,y:200+((i*37)%205),color:['#e83d40','#ffd84a','#f3f5ff','#48c7eb'][i%4],seed:i*.73}));players=[makePlayer(340,1,'p1'),makePlayer(940,-1,'p2')];resetBall();particles=[];phase='play';flash=0;shake=0}
function makePlayer(x,dir,id){return{x,y:GROUND,vx:0,vy:0,dir,id,anim:0,kick:0,cool:0,hit:0,land:0}}
function resetBall(){ball={x:W/2,y:285,vx:rand(-2,2),vy:0,rot:0,trail:[]};for(const p of players){p.x=p.dir===1?340:940;p.y=GROUND;p.vx=p.vy=p.kick=p.cool=0}}
let players=[];
function puff(x,y,n,col){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-7,7),vy:rand(-8,2),life:rand(15,40),max:40,size:rand(2,7),col})}
function shoot(p,lob){if(p.cool>0)return;p.cool=22;p.kick=12;p.hit=1;const dx=ball.x-(p.x+p.dir*34),dy=ball.y-(p.y-62);if(Math.hypot(dx,dy)<125){ball.vx=p.dir*(lob?11.5:18)+p.vx*.35;ball.vy=lob?-15.5:-7.3;ball.rot+=p.dir*1.4;shake=9;puff(ball.x,ball.y,17,'#ffeb9d')}else puff(p.x+p.dir*55,p.y-55,4,'#d9faff')}
function input(p,idx){if(idx===0)return{l:keys.has('ArrowLeft')||touch.has('left'),r:keys.has('ArrowRight')||touch.has('right'),j:keys.has('ArrowUp')||touch.has('jump'),kick:keys.has(' ')||touch.has('kick'),lob:keys.has('x')||touch.has('lob')};const d=ball.x-p.x;return{l:d< -34,r:d>34,j:ball.y<p.y-130&&Math.abs(d)<115,kick:Math.abs(d)<105&&Math.abs(ball.y-(p.y-65))<120,lob:false}}
function physics(){if(phase!=='play')return;tick++;time=Math.max(0,90-tick/60);if(time===0){phase='over';overlay.style.display='flex';document.querySelector('#panel h1').textContent=score[0]===score[1]?'ÉGALITÉ !':score[0]>score[1]?'VICTOIRE !':'DÉFAITE !';document.querySelector('#play').textContent='REJOUER';return}
for(let i=0;i<2;i++){const p=players[i],v=input(p,i),move=(v.r?1:0)-(v.l?1:0);p.vx+=(move*6.4-p.vx)*(p.y<GROUND?.19:.34);p.x=clamp(p.x+p.vx,90,W-90);if(move)p.dir=move;if(v.j&&p.y>=GROUND-.1){p.vy=-13.6;p.land=0;puff(p.x,GROUND,6,'#b9f59b')}p.vy+=GRAV;p.y+=p.vy;if(p.y>GROUND){if(p.vy>5){p.land=1;puff(p.x,GROUND,7,'#c6ec91')}p.y=GROUND;p.vy=0}p.anim+=Math.abs(p.vx)*.1+.045;p.kick=Math.max(0,p.kick-1);p.cool=Math.max(0,p.cool-1);p.hit*=.77;p.land*=.76;if(v.kick)shoot(p,false);else if(v.lob)shoot(p,true)}
if(Math.abs(players[0].x-players[1].x)<94&&Math.abs(players[0].y-players[1].y)<80){const mid=(players[0].x+players[1].x)/2;players[0].x=mid-47;players[1].x=mid+47}
ball.vy+=.37;ball.vx*=.998;const s=Math.hypot(ball.vx,ball.vy);if(s>23){ball.vx*=23/s;ball.vy*=23/s}ball.x+=ball.vx;ball.y+=ball.vy;ball.rot+=ball.vx*.048+ball.vy*.012;
if(ball.y>GROUND-R){ball.y=GROUND-R;ball.vy=-Math.abs(ball.vy)*.7;if(Math.abs(ball.vy)<1.2)ball.vy=0;ball.vx*=.96}
if(ball.y<R){ball.y=R;ball.vy=Math.abs(ball.vy)*.75}
for(const p of players){for(const [cx,cy,cr] of [[p.x,p.y-117,64],[p.x+p.dir*35,p.y-34,30]]){const dx=ball.x-cx,dy=ball.y-cy,d=Math.hypot(dx,dy),min=R+cr;if(d>0&&d<min){const nx=dx/d,ny=dy/d;ball.x=cx+nx*min;ball.y=cy+ny*min;const impact=(ball.vx-p.vx)*nx+(ball.vy-p.vy)*ny;if(impact<0){ball.vx-=(1.65*impact)*nx;ball.vy-=(1.65*impact)*ny;ball.vx+=p.vx*.18;p.hit=1;if(Math.abs(impact)>5)puff(ball.x,ball.y,7,'#fff5d2')}}}}
for(const side of [0,1]){const edge=side===0?88:W-88;if((side===0?ball.x<edge:ball.x>edge)&&ball.y>GROUND-230){score[1-side]++;goalTimer=70;flash=1;shake=16;puff(ball.x,ball.y,75,side?'#ffd54e':'#55ddff');phase='goal';break}}
if(ball.x<R){ball.x=R;ball.vx=Math.abs(ball.vx)*.7}if(ball.x>W-R){ball.x=W-R;ball.vx=-Math.abs(ball.vx)*.7}
ball.trail.unshift({x:ball.x,y:ball.y});if(ball.trail.length>8)ball.trail.pop();
for(const q of particles){q.x+=q.vx;q.y+=q.vy;q.vy+=.19;q.life--}particles=particles.filter(q=>q.life>0)}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function line(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineJoin='round';ctx.lineCap='round';ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke()}
function stadium(){const sky=ctx.createLinearGradient(0,0,0,520);sky.addColorStop(0,'#202f74');sky.addColorStop(.55,'#f18b75');sky.addColorStop(1,'#f6ca83');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);if(ready(assets.stadium)){ctx.save();ctx.globalAlpha=.85;ctx.drawImage(assets.stadium,0,-100,W,600);ctx.restore()}
const roof=ctx.createLinearGradient(0,70,0,250);roof.addColorStop(0,'#27395c');roof.addColorStop(1,'#10192c');ctx.fillStyle=roof;ctx.beginPath();ctx.moveTo(0,80);ctx.quadraticCurveTo(640,260,1280,80);ctx.lineTo(1280,220);ctx.quadraticCurveTo(640,350,0,220);ctx.fill();for(let i=0;i<15;i++){const x=i*95;line([[x,125],[640+(x-640)*.7,282]],'#7786a7',4)}
for(const f of crowd){const bob=Math.sin(tick*.1+f.seed)*3;ctx.fillStyle=f.color;ctx.beginPath();ctx.arc(f.x,f.y+bob,5.5,0,7);ctx.fill()}ctx.fillStyle='#152039';ctx.fillRect(0,418,W,35);for(let i=0;i<9;i++){rounded(i*154+8,425,143,19,5,i%2?'#e4474c':'#2688d6')}
for(const x of [105,1175]){const light=ctx.createRadialGradient(x,132,2,x,132,180);light.addColorStop(0,'#fff9d9dd');light.addColorStop(.18,'#ffe9a866');light.addColorStop(1,'#ffffff00');ctx.fillStyle=light;ctx.fillRect(x-180,0,360,350)}
const grass=ctx.createLinearGradient(0,456,0,H);grass.addColorStop(0,'#74e16b');grass.addColorStop(.62,'#2eaa58');grass.addColorStop(1,'#116e45');ctx.fillStyle=grass;ctx.fillRect(0,454,W,H-454);for(let i=0;i<13;i++){ctx.fillStyle=i%2?'#ffffff08':'#003c2d0b';ctx.fillRect(i*100,454,100,266)}line([[130,470],[1150,470],[1235,GROUND+44],[45,GROUND+44],[130,470]],'#edfff4',5);line([[640,470],[640,GROUND+44]],'#edfff4',4);ctx.strokeStyle='#eafff5';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(640,550,115,38,0,0,7);ctx.stroke();line([[130,495],[245,495],[230,GROUND+38],[55,GROUND+38]],'#eafff5',4);line([[1150,495],[1035,495],[1050,GROUND+38],[1225,GROUND+38]],'#eafff5',4);ctx.fillStyle='#063c2c88';ctx.fillRect(0,GROUND+54,W,90)}
function goal(side){const left=side===0,x=left?85:1195,dir=left?-1:1,back=x+dir*67,top=GROUND-230;ctx.fillStyle='#ffffff13';ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(back,top-32);ctx.lineTo(back,GROUND-26);ctx.lineTo(x,GROUND);ctx.fill();ctx.strokeStyle='#d9efff99';ctx.lineWidth=2;for(let i=0;i<=8;i++){const t=i/8;line([[x+(back-x)*t,top-32*t],[x+(back-x)*t,GROUND-26*t]],'#e8f8ff88',1.6)}for(let i=0;i<=10;i++){const t=i/10;line([[x,top+(GROUND-top)*t],[back,top-32+(GROUND-top+6)*t]],'#e8f8ff88',1.6)}line([[x,GROUND],[x,top],[back,top-32]],'#172236',18);line([[x,GROUND],[x,top],[back,top-32]],'#ffffff',11);line([[x-3,GROUND],[x-3,top+4],[back-3,top-28]],'#b7e8ff',3);rounded(x-11,GROUND-5,22,12,5,'#162238')}
function shadow(x,y,w){ctx.fillStyle='#092b2c70';ctx.beginPath();ctx.ellipse(x,y,w,10,0,0,7);ctx.fill()}
function player(p){shadow(p.x,GROUND+10,52-(GROUND-p.y)*.1);const bounce=p.y>=GROUND?Math.sin(p.anim)*Math.min(5,Math.abs(p.vx)):0;ctx.save();ctx.translate(p.x,p.y-bounce);const sx=1+p.land*.12-p.hit*.05,sy=1-p.land*.14+p.hit*.07;ctx.scale(sx,sy);
ctx.save();ctx.translate(p.dir*25,-20);ctx.rotate(p.dir*(p.kick>0?-.48*Math.sin((12-p.kick)/12*Math.PI):.05*Math.sin(p.anim)));ctx.scale(-p.dir,1);if(ready(assets.boot)){ctx.drawImage(assets.boot,-62,-60,122,77)}else{rounded(-52,-45,108,52,17,'#151a26');rounded(-44,-45,82,35,13,p.id==='p1'?'#ffb52e':'#4ad7f4')}ctx.restore();
const im=assets[p.id+(p.kick>0?'hit':'')];const fallback=assets[p.id];if(ready(im)||ready(fallback)){const pic=ready(im)?im:fallback;ctx.save();ctx.scale(p.dir,1);ctx.drawImage(pic,-81,-232,162,174);ctx.restore()}else{ctx.fillStyle=p.id==='p1'?'#f7b73b':'#57c7f0';ctx.beginPath();ctx.arc(0,-142,70,0,7);ctx.fill();ctx.fillStyle='#1b2238';ctx.beginPath();ctx.arc(p.dir*24,-154,7,0,7);ctx.fill()}
if(p.hit>.08){ctx.globalAlpha=p.hit*.8;ctx.strokeStyle='#fff4bc';ctx.lineWidth=5;ctx.beginPath();ctx.arc(p.dir*65,-85,40+(1-p.hit)*30,-1.3,1.3);ctx.stroke()}ctx.restore()}
function drawBall(){for(let i=ball.trail.length-1;i>=0;i--){const q=ball.trail[i];ctx.globalAlpha=(1-i/8)*.14;ctx.fillStyle='#d8f7ff';ctx.beginPath();ctx.arc(q.x,q.y,R*(1-i/12),0,7);ctx.fill()}ctx.globalAlpha=1;shadow(ball.x,GROUND+9,clamp(25-(GROUND-ball.y)*.04,7,25));ctx.save();ctx.translate(ball.x,ball.y);ctx.rotate(ball.rot);ctx.fillStyle='#f9fbff';ctx.strokeStyle='#142139';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#19253c';for(let i=0;i<5;i++){const a=i*Math.PI*2/5+Math.PI/2;ctx.beginPath();ctx.arc(Math.cos(a)*14,Math.sin(a)*14,5,0,7);ctx.fill()}ctx.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;const x=Math.cos(a)*9,y=Math.sin(a)*9;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fill();ctx.restore()}
function hud(){rounded(410,5,460,100,20,'#0c1735');rounded(419,13,442,83,16,'#344566');rounded(430,25,116,61,12,'#101c36');rounded(734,25,116,61,12,'#101c36');rounded(565,25,150,61,12,'#101c36');ctx.textAlign='center';ctx.font='900 49px system-ui';ctx.fillStyle='#b6ff4b';ctx.fillText(score[0],488,73);ctx.fillText(score[1],792,73);ctx.fillStyle='#fff';ctx.fillText(Math.ceil(time),640,73);ctx.font='bold 18px system-ui';ctx.fillText('KAWARJIA',640,18);ctx.font='bold 16px system-ui';ctx.fillText('BEY',345,32);ctx.fillText('HANNIBAL',935,32)}
const buttons=[{id:'left',x:110,y:640,t:'◀',c:'#f89e23'},{id:'right',x:225,y:640,t:'▶',c:'#f89e23'},{id:'kick',x:1020,y:640,t:'⚽',c:'#ff9c26'},{id:'lob',x:1135,y:640,t:'↗',c:'#e96a32'},{id:'jump',x:1200,y:540,t:'↑',c:'#55c837'}];
function controls(){for(const b of buttons){ctx.fillStyle='#10182c';ctx.beginPath();ctx.arc(b.x,b.y,49,0,7);ctx.fill();ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,43,0,7);ctx.fill();ctx.strokeStyle='#ffffffbb';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='900 44px system-ui';ctx.fillText(b.t,b.x,b.y+2)}ctx.textBaseline='alphabetic'}
function render(){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0b1326';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.setTransform(scale,0,0,scale,offX,offY);ctx.save();if(shake>.1){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.83}stadium();goal(0);goal(1);players.forEach(player);drawBall();for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}ctx.globalAlpha=1;hud();controls();if(phase==='goal'){ctx.fillStyle='#ffffff22';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='1000 100px system-ui';ctx.lineWidth=12;ctx.strokeStyle='#182743';ctx.strokeText('BUUUUT !',640,250);ctx.fillStyle='#ffdb52';ctx.fillText('BUUUUT !',640,250)}ctx.restore()}
function loop(t){const dt=Math.min(60,t-last||16);last=t;acc+=dt;let steps=0;while(acc>=1000/60&&steps++<4){if(phase==='play')physics();else if(phase==='goal'){goalTimer--;if(goalTimer<=0){resetBall();phase='play'}}acc-=1000/60}render();requestAnimationFrame(loop)}
function action(e,down){const x=(e.clientX*(canvas.width/innerWidth)-offX)/scale,y=(e.clientY*(canvas.height/innerHeight)-offY)/scale;for(const b of buttons)if(Math.hypot(x-b.x,y-b.y)<55){down?touch.add(b.id):touch.delete(b.id);if(down&&b.id==='kick')shoot(players[0],false);if(down&&b.id==='lob')shoot(players[0],true);return}if(!down)touch.clear()}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);action(e,true)});canvas.addEventListener('pointerup',e=>action(e,false));canvas.addEventListener('pointercancel',()=>touch.clear());
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();keys.add(e.key)});addEventListener('keyup',e=>keys.delete(e.key));
document.querySelector('#play').onclick=()=>{overlay.style.display='none';reset()};players=[makePlayer(340,1,'p1'),makePlayer(940,-1,'p2')];resetBall();crowd=Array.from({length:340},(_,i)=>({x:(i*67)%1320,y:200+((i*37)%205),color:['#e83d40','#ffd84a','#f3f5ff','#48c7eb'][i%4],seed:i*.73}));requestAnimationFrame(loop);
</script></body></html>
